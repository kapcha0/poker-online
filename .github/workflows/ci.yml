name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  core-tests:
    name: PokerCore (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build PokerCore
        run: dotnet build shared/PokerCore/PokerCore.csproj -c Release

      - name: Run tests
        run: dotnet test shared/PokerCore.Tests/PokerCore.Tests.csproj -c Release --logger "console;verbosity=normal"

  sanity:
    name: Repo layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repo layout
        run: |
          echo "Проверяем наличие ключевых каталогов..."
          for d in client shared server docs; do
            if [ -d "$d" ]; then echo "OK: $d/"; else echo "MISSING: $d/"; exit 1; fi
          done

      - name: Docs presence
        run: |
          test -f README.md && echo "OK: README.md"
          test -f docs/SETUP.md && echo "OK: docs/SETUP.md"
          test -f docs/ROADMAP.md && echo "OK: docs/ROADMAP.md"
