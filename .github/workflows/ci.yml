name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Заглушка: на этапе 0 проверяем, что CI вообще запускается.
  # Реальные сборка/тесты Unity и сервера добавятся на этапах 1 и 6.
  sanity:
    name: Sanity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repo layout
        run: |
          echo "Проверяем наличие ключевых каталогов..."
          for d in client shared server docs; do
            if [ -d "$d" ]; then echo "OK: $d/"; else echo "MISSING: $d/"; exit 1; fi
          done

      - name: Docs presence
        run: |
          test -f README.md && echo "OK: README.md"
          test -f docs/SETUP.md && echo "OK: docs/SETUP.md"
          test -f docs/ROADMAP.md && echo "OK: docs/ROADMAP.md"
