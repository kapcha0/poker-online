# Локальная инфраструктура разработки (этап 6 по docs/ROADMAP.md).
# Запуск:  docker compose up -d
# Стоп:   docker compose down
#
# Бесплатно на разработке. К релизу — платный хостинг (см. ROADMAP).
services:
  postgres:
    image: postgres:16-alpine
    container_name: poker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker_dev_password
      POSTGRES_DB: poker_dev
    ports:
      - "5432:5432"
    volumes:
      - poker-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker -d poker_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: poker-redis
    restart: unless-stopped
    # Без пароля и только с localhost — это dev-окружение, не прод.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - poker-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  poker-pgdata:
  poker-redisdata:
